name: Python Script Update

on:
  schedule:
    - cron: "*/9 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-timestamp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update timestamp file
        run: |
          TIMESTAMP_FILE="updates.txt"
          echo "Last checked: $(date -u +"%Y-%m-%dT%H:%M:%SZ")" > "$TIMESTAMP_FILE"

      - name: Commit and push changes
        run: |
          git config user.name "brutal-45 bot"
          git config user.email "creatorsports81@gmail.com"
          git add updates.txt
          if ! git diff --cached --quiet; then
            git commit -m "Update timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            git push
          else
            echo "No changes to commit"
          fi
